<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #151516; color: #f4f4f5; font-family: Arial, sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 520px;
              border: 1px solid #343436;
              border-radius: 16px;
              background: #1c1c1d;
            "
          >
            <tr>
              <td style="padding: 32px">
                <p
                  style="
                    margin: 0 0 10px;
                    color: #c49d61;
                    font-size: 12px;
                    font-weight: 700;
                    letter-spacing: 0.16em;
                  "
                >
                  HH GROUP
                </p>
                <h1 style="margin: 0; color: #ffffff; font-size: 26px; line-height: 1.3">
                  Reset your password
                </h1>
                <p style="margin: 14px 0 24px; color: #a1a1aa; font-size: 15px; line-height: 1.6">
                  Open the secure recovery page, then enter the one-time code shown below.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .RedirectTo }}"
                    style="
                      display: inline-block;
                      border-radius: 9px;
                      background: #c49d61;
                      color: #17130d;
                      font-size: 15px;
                      font-weight: 700;
                      padding: 13px 20px;
                      text-decoration: none;
                    "
                  >
                    Continue password reset
                  </a>
                </p>
                <p style="margin: 0 0 8px; color: #a1a1aa; font-size: 13px">
                  One-time recovery code
                </p>
                <p
                  style="
                    margin: 0;
                    border: 1px solid #3f3f46;
                    border-radius: 10px;
                    background: #151516;
                    color: #ffffff;
                    font-family: ui-monospace, Menlo, monospace;
                    font-size: 26px;
                    font-weight: 700;
                    letter-spacing: 0.18em;
                    padding: 16px;
                    text-align: center;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 24px 0 0; color: #71717a; font-size: 12px; line-height: 1.6">
                  This code expires in one hour and can be used only once. If you did not request
                  this email, you can safely ignore it.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

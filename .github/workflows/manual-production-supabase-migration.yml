name: Production Supabase Migration Release Gate

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: Type REVIEW_PRODUCTION_MIGRATION_RELEASE_ARTIFACT to review the release instructions.
        required: true
        type: string

jobs:
  release-gate:
    name: Review only — no database mutation
    runs-on: ubuntu-latest
    steps:
      - name: Require acknowledgement
        env:
          ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
        run: |
          test "$ACKNOWLEDGEMENT" = "REVIEW_PRODUCTION_MIGRATION_RELEASE_ARTIFACT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm operator runbook is present
        run: |
          test -f docs/PRODUCTION_MIGRATION_RELEASE_REPAIR.md
          echo "No database mutation is available from this workflow."
          echo "Use the reviewed operator runbook for an approved, audited Production change window."
